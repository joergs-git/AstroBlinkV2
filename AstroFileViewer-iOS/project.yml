name: AstroFileViewer
options:
  bundleIdPrefix: com.joergsflow
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "15.0"

packages:
  ImageDecoder:
    path: Packages/ImageDecoder

targets:
  AstroFileViewer:
    type: application
    platform: iOS
    sources: [AstroFileViewer]
    dependencies:
      - package: ImageDecoder
        product: ImageDecoderBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joergsflow.AstroFileViewer
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
    info:
      path: AstroFileViewer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSPhotoLibraryAddUsageDescription: "AstroFileViewer saves stretched FITS/XISF images as JPEG to your Photo Library."
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: XISF Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pixinsight.xisf
          - CFBundleTypeName: FITS Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - gov.nasa.gsfc.fits
          # TIFF: system-defined UTI public.tiff covers .tif / .tiff
          # Pixel-only viewer (no metadata extraction), so role is Viewer + Alternate.
          - CFBundleTypeName: TIFF Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.tiff
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.pixinsight.xisf
            UTTypeDescription: XISF Image
            UTTypeConformsTo:
              - public.data
              - public.image
            UTTypeTagSpecification:
              public.filename-extension:
                - xisf
              public.mime-type: application/x-xisf
          - UTTypeIdentifier: gov.nasa.gsfc.fits
            UTTypeDescription: FITS Image
            UTTypeConformsTo:
              - public.data
              - public.image
            UTTypeTagSpecification:
              public.filename-extension:
                - fits
                - fit
                - fts
              public.mime-type: application/fits
