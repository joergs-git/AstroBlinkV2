name: AstroTriage
options:
  bundleIdPrefix: com.joergsflow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  AstroTriage:
    build:
      targets:
        AstroTriage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AstroTriageTests
  AstroBlinkMCPServer:
    build:
      targets:
        AstroBlinkMCPServer: all
    run:
      config: Debug

packages:
  ImageDecoder:
    path: Packages/ImageDecoder
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.4.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_OBJC_INTEROP_MODE: objcxx

targets:
  AstroTriage:
    type: application
    platform: macOS
    sources:
      - path: AstroTriage
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ImageDecoder
        product: ImageDecoderBridge
      - package: GRDB
        product: GRDB
      - target: AstroTriageQuickLookThumbnail
      - target: AstroTriageQuickLookPreview
      - target: AstroBlinkMCPServer  # build order — embedded via postBuildScripts below
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joergsflow.AstroBlinkV2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AstroTriage/Info.plist
        CURRENT_PROJECT_VERSION: 94
        MARKETING_VERSION: "6.0.4"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AstroTriage/AstroTriage.entitlements
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: AstroBlinkV2
        PRODUCT_MODULE_NAME: AstroTriage
        METAL_COMPILER_FLAGS: ""
        SWIFT_OBJC_INTEROP_MODE: objcxx
        OTHER_LDFLAGS:
          - "-lz"
    postBuildScripts:
      - name: "Sign SPM Resource Bundles"
        script: |
          # SPM resource bundles (e.g. GRDB_GRDB.bundle) are not automatically signed
          # by the export step. App Store Connect requires them to be signed with the
          # same distribution certificate as the main app (ITMS-90284).
          # For archive builds, use the distribution cert directly since the export
          # step re-signs the main app but skips resource bundles.
          if [ "${CONFIGURATION}" = "Release" ]; then
            SIGN_IDENTITY="Apple Distribution: Joerg Klaas (FDSVBU33S8)"
          else
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY}"
          fi
          find "${CODESIGNING_FOLDER_PATH}/Contents/Resources" -name "*.bundle" -print0 | while IFS= read -r -d '' bundle; do
            codesign --force --sign "${SIGN_IDENTITY}" --generate-entitlement-der "$bundle"
          done
      - name: "Embed AstroBlinkMCPServer"
        script: |
          # Bundle the MCP server binary inside the .app so the path stays stable
          # across rebuilds and so Claude Desktop's config doesn't break when
          # DerivedData is cleaned. Path inside the bundle:
          #   AstroBlinkV2.app/Contents/Helpers/AstroBlinkMCPServer
          MCP_SRC="${CONFIGURATION_BUILD_DIR}/AstroBlinkMCPServer"
          DEST_DIR="${CODESIGNING_FOLDER_PATH}/Contents/Helpers"
          if [ ! -f "$MCP_SRC" ]; then
            echo "warning: AstroBlinkMCPServer binary not found at $MCP_SRC — skipping embed"
            exit 0
          fi
          mkdir -p "$DEST_DIR"
          cp -f "$MCP_SRC" "$DEST_DIR/AstroBlinkMCPServer"
          # Re-sign so the embedded helper validates against the app's signature.
          if [ "${CONFIGURATION}" = "Release" ]; then
            SIGN_IDENTITY="Apple Distribution: Joerg Klaas (FDSVBU33S8)"
          else
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY}"
          fi
          codesign --force --sign "${SIGN_IDENTITY}" --options runtime --timestamp=none "$DEST_DIR/AstroBlinkMCPServer"

  AstroTriageQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLookExtension
        excludes:
          - "**/.DS_Store"
          - PreviewProvider.swift
    dependencies:
      - package: ImageDecoder
        product: ImageDecoderBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joergsflow.AstroBlinkV2.QuickLookThumbnail
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickLookExtension/Info.plist
        CURRENT_PROJECT_VERSION: 94
        MARKETING_VERSION: "6.0.4"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuickLookExtension/QuickLookExtension.entitlements
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "-lz"

  AstroTriageQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLookExtension
        excludes:
          - "**/.DS_Store"
          - ThumbnailProvider.swift
          - Info.plist
      - path: QuickLookPreview
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ImageDecoder
        product: ImageDecoderBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joergsflow.AstroBlinkV2.QuickLookPreview
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickLookPreview/Info.plist
        CURRENT_PROJECT_VERSION: 94
        MARKETING_VERSION: "6.0.4"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuickLookPreview/QuickLookPreview.entitlements
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "-lz"

  AstroTriageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: AstroTriage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joergsflow.AstroTriageTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AstroBlinkV2.app/Contents/MacOS/AstroBlinkV2"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Standalone CLI binary that exposes AstroBlinkV2 to LLM clients (Claude Desktop,
  # Claude Code, etc.) via the Model Context Protocol. Reads the same FrameHistory
  # SQLite read-only, and delegates ingest/mark actions back to the running app via
  # the astroblink:// URL scheme. Not sandboxed (CLI tools aren't by default).
  AstroBlinkMCPServer:
    type: tool
    platform: macOS
    sources:
      - path: MCPServer
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: GRDB
        product: GRDB
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: AstroBlinkMCPServer
        DEVELOPMENT_TEAM: FDSVBU33S8
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
